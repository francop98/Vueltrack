<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/mapa.css">
  <link rel="stylesheet" href="/css/inicio.css">
</head>
<body>
  <div class="splash" id="splash" role="status" aria-label="Cargando Vueltrack">
    <svg class="splash-logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#172033"/>
      <path d="M9 22c0-6 3-11 7-11s7 5 7 9-3 5-5 5-3.5-2-3.5-4" fill="none" stroke="#F07A2B" stroke-opacity="0.22" stroke-width="2.6" stroke-linecap="round"/>
      <path id="splash-camino" d="M9 22c0-6 3-11 7-11s7 5 7 9-3 5-5 5-3.5-2-3.5-4" fill="none" stroke="#F07A2B" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.78;1" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <circle r="2.4" fill="#FFFFFF">
        <animateMotion dur="1.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.78;1" calcMode="linear">
          <mpath href="#splash-camino"/>
        </animateMotion>
      </circle>
    </svg>
    <span class="splash-texto">vuel<span>track</span></span>
  </div>
  <script src="/js/splash.js"></script>

  <div class="app">
    <main class="contenido">
      <header class="barra-sup">
        <div class="barra-izq">
          <button type="button" class="btn-icono" id="btn-menu" aria-label="Abrir menú" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <a class="marca" href="/" aria-label="Vueltrack, inicio">
          <img src="/assets/icono.svg" alt="">
          <span class="marca-texto">vuel<span>track</span></span>
        </a>
        </div>
      </header>

      <div class="titulo-bloque">
        <span class="sobre-titulo" id="fecha"></span>
        <h1 class="titulo" id="saludo">Hola</h1>
        <span class="texto-tenue" id="titulo">Tu vuelta de hoy</span>
      </div>

      <div class="aviso-instalar oculto" id="aviso-instalar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span class="titulo-bloque">
          <strong>Instalá Vueltrack</strong>
          <span class="texto-tenue">Abrila desde la pantalla de inicio, como una app.</span>
        </span>
        <button type="button" class="btn btn-primario" id="btn-instalar">Instalar</button>
        <button type="button" class="btn-icono sin-borde" id="btn-instalar-cerrar" aria-label="Ocultar aviso">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button type="button" class="aviso-instalar oculto" id="aviso-zona">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span class="titulo-bloque">
          <strong>Cargá tu zona de trabajo</strong>
          <span class="texto-tenue">Así las búsquedas priorizan tu localidad y tu provincia.</span>
        </span>
      </button>

      <a class="alertas oculto" id="alertas" href="/pages/vehiculo.html"></a>

      <div class="chips desplazable oculto" id="filtro" role="group" aria-label="Ver la vuelta de"></div>

      <div class="cargando" id="cargando" aria-label="Cargando"></div>

      <div class="vacio oculto" id="vacio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>
        <strong id="vacio-titulo">Todavía no hay vuelta para hoy</strong>
        <p id="vacio-texto"></p>
        <a class="btn btn-primario oculto" id="vacio-boton" href="/pages/armar.html">Armar la vuelta</a>
      </div>

      <div class="grilla-stats oculto" id="stats">
        <div class="stat"><span class="stat-valor" id="st-paradas">—</span><span class="stat-nombre">paradas</span></div>
        <div class="stat"><span class="stat-valor" id="st-km">—</span><span class="stat-nombre">recorrido</span></div>
        <div class="stat"><span class="stat-valor" id="st-tiempo">—</span><span class="stat-nombre">estimado</span></div>
        <div class="stat"><span class="stat-valor" id="st-fin">—</span><span class="stat-nombre">terminás</span></div>
      </div>


      <div class="mapa oculto" id="mapa-caja">
        <div class="mapa-lienzo" id="mapa" aria-label="Mapa de la vuelta"></div>
        <div class="mapa-leyenda" id="leyenda"></div>
        <div class="mapa-leyenda arriba oculto" id="en-vivo"></div>
      </div>

      <label class="interruptor tarjeta oculto" for="compartir-check" id="compartir">
        <span><strong>Compartir mi ubicación con el equipo</strong><br><span class="texto-tenue">Solo mientras tengas la app abierta</span></span>
        <input type="checkbox" id="compartir-check">
      </label>

      <section class="tarjeta-destacada oculto" id="proxima" aria-labelledby="proxima-nombre"></section>

      <section class="seccion oculto" id="bloque-lista">
        <div class="fila-titulo">
          <h2 class="subtitulo" id="lista-titulo">Paradas</h2>
          <span class="fila-boton">
            <button type="button" class="chip oculto" id="btn-reordenar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
              Reordenar
            </button>
            <button type="button" class="chip oculto" id="btn-agregar-destino"><span class="mas" aria-hidden="true">+</span>Destino</button>
            <a class="chip oculto" id="link-editar" href="/pages/armar.html">Editar</a>
          </span>
        </div>
        <div id="listas" class="seccion"></div>
        <a class="btn btn-contorno" href="/pages/hoja-ruta.html">Ver la hoja de ruta del día</a>
      </section>
    </main>
  </div>

  <nav class="nav-inferior" id="nav" aria-label="Secciones"></nav>
  <script src="/js/nav.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/inicio.js"></script>
</body>
</html>
