<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Modo manejo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/manejo.css">
</head>
<body>
  <div class="app manejo">
    <header class="manejo-barra">
      <a class="btn-icono" href="/" aria-label="Salir del modo manejo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="manejo-progreso">
        <span class="texto-tenue" id="contexto">Modo manejo</span>
        <div class="progreso" id="progreso" aria-hidden="true"></div>
      </div>
    </header>

    <main class="manejo-cuerpo" id="cuerpo">
      <div class="cargando" aria-label="Cargando"></div>
    </main>
  </div>

  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/manejo.js"></script>
</body>
</html>
