<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Parada</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/mapa.css">
  <link rel="stylesheet" href="/css/parada.css">
</head>
<body>
  <div class="app">
    <header class="parada-cabecera">
      <div class="barra-sup">
        <div class="barra-izq">
        <button type="button" class="btn-icono" id="btn-menu" aria-label="Abrir menú" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="btn-icono" href="/" aria-label="Volver a la vuelta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        </div>
        <span class="tenue texto-chico-fuerte" id="contexto"></span>
      </div>
      <div class="progreso" id="progreso" aria-hidden="true"></div>
      <div class="titulo-bloque">
        <h1 id="nombre">Cargando…</h1>
        <span class="tenue texto-direccion" id="direccion"></span>
      </div>
      <div class="chips" id="pastillas"></div>
    </header>

    <main class="contenido sin-nav">
      <div class="grilla-2 siempre" id="acciones"></div>

      <section class="tarjeta oculto" id="motivo">
        <span class="etiqueta-campo texto-tenue">Por qué no se entregó</span>
        <span id="motivo-texto"></span>
      </section>

      <section class="tarjeta oculto" id="nota">
        <span class="etiqueta-campo texto-tenue">Nota</span>
        <span id="nota-texto"></span>
      </section>

      <a class="tarjeta enlace-plano oculto" id="siguiente"></a>

      <button type="button" class="link" id="btn-ubicacion">Estoy en la puerta: guardar esta ubicación</button>

      <div class="seccion" id="botones-estado"></div>

      <section class="tarjeta seccion oculto" id="comprobante"></section>

      <div class="grilla-2 siempre oculto" id="gestion">
        <button type="button" class="btn" id="btn-editar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
          Editar destino
        </button>
        <button type="button" class="btn btn-peligro" id="btn-eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          Eliminar
        </button>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/parada.js"></script>
</body>
</html>
