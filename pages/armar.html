<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Armar la vuelta</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/mapa.css">
</head>
<body>
  <div class="app">
    <main class="contenido">
      <header class="barra-sup">
        <div class="barra-izq">
          <button type="button" class="btn-icono" id="btn-menu" aria-label="Abrir menú" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <a class="marca" href="/" aria-label="Vueltrack, inicio">
          <img src="/assets/icono.svg" alt="">
          <span class="marca-texto">vuel<span>track</span></span>
        </a>
        </div>
      </header>

      <div class="fila-titulo">
        <h1 class="titulo">Armar la vuelta</h1>
        <label class="solo-lector" for="fecha">Día de la vuelta</label>
        <input type="date" id="fecha" class="input input-fecha">
      </div>

      <section class="seccion oculto" id="bloque-salen">
        <div class="fila-titulo">
          <h2 class="subtitulo">¿Quiénes salen este día?</h2>
          <button type="button" class="link" id="btn-redistribuir">Dividir por zona</button>
        </div>
        <div class="chips" id="chips-salen" role="group" aria-label="Fleteros que salen"></div>
        <p class="texto-tenue">Cada destino que agregues se asigna solo al fletero de esa zona. Tocá el nombre en una parada para cambiarlo.</p>
      </section>

      <div class="campo buscador">
        <label for="dir">Agregar destino</label>
        <div class="buscador-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="dir" placeholder="Dirección o nombre del lugar">
        </div>
      </div>

      <div class="chips">
        <button type="button" class="chip" id="btn-pegar">Pegar varias direcciones</button>
        <button type="button" class="chip" id="btn-repetir">Repetir una vuelta anterior</button>
      </div>

      <section class="seccion">
        <h2 class="subtitulo">Clientes habituales</h2>
        <button type="button" class="btn btn-contorno" id="btn-elegir-clientes">Elegir clientes</button>
        <button type="button" class="chip punteado oculto" id="btn-toca"></button>
      </section>

      <section class="seccion">
        <h2 class="subtitulo" id="titulo-paradas">Paradas cargadas</h2>
        <div class="lista" id="lista-paradas"></div>
        <p class="texto-tenue oculto" id="sin-paradas">Todavía no cargaste paradas para este día.</p>
      </section>

      <section class="seccion">
        <h2 class="subtitulo">Cómo sale la vuelta</h2>
        <div class="lista ajustes">
          <button type="button" class="fila" id="btn-base">
            <span>Salgo desde</span>
            <strong id="txt-base">Elegir…</strong>
          </button>
          <div class="fila">
            <label for="salida">Hora de salida</label>
            <span class="fila-boton">
              <input type="time" id="salida" class="input input-hora">
              <button type="button" class="chip" id="btn-ahora">Ahora</button>
            </span>
          </div>
          <button type="button" class="fila" id="btn-orden">
            <span>Orden de las paradas</span>
            <strong id="txt-orden">Más conveniente</strong>
          </button>
          <button type="button" class="fila" id="btn-pausa">
            <span>Pausa (almuerzo)</span>
            <strong id="txt-pausa">Sin pausa</strong>
          </button>
          <label class="fila interruptor" for="volver">
            <span>Vuelvo al punto de salida</span>
            <input type="checkbox" id="volver">
          </label>
          <label class="fila" for="demora">
            <span>Demora por parada</span>
            <select id="demora" class="input input-hora">
              <option value="2">2 min</option>
              <option value="3">3 min</option>
              <option value="5">5 min</option>
              <option value="8">8 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="30">30 min</option>
            </select>
          </label>
        </div>
      </section>

      <div class="seccion">
        <button type="button" class="btn btn-primario btn-grande" id="btn-ordenar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>
          Ordenar la vuelta
        </button>
        <a class="btn btn-contorno oculto" id="btn-repartir" href="/pages/repartir.html">Repartir entre fleteros</a>
      </div>
    </main>
  </div>

  <nav class="nav-inferior" id="nav" aria-label="Secciones"></nav>
  <script src="/js/nav.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/armar.js"></script>
</body>
</html>
