<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Ingresar</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/ingreso.css">
</head>
<body>
  <main class="ingreso">
    <div class="ingreso-marca">
      <img src="/assets/icono.svg" alt="">
      <span class="marca-texto">vuel<span>track</span></span>
      <span class="texto-tenue">Armá la vuelta. Seguila parada por parada.</span>
    </div>

    <div class="segmentado" role="tablist" aria-label="Ingresar o crear cuenta">
      <button type="button" role="tab" id="tab-ingresar" class="activo" aria-selected="true">Ingresar</button>
      <button type="button" role="tab" id="tab-crear" aria-selected="false">Crear cuenta</button>
    </div>

    <form class="seccion" id="form" method="post" action="#" novalidate>
      <div class="campo oculto" id="campo-nombre">
        <label for="nombre">Tu nombre</label>
        <input id="nombre" autocomplete="name" placeholder="Nombre y apellido">
      </div>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </div>
      <label class="casilla-linea" for="recordar">
        <input type="checkbox" id="recordar" checked>
        Recordar mis datos en este celular
      </label>
      <p class="error-texto oculto" id="error" role="alert"></p>
      <button type="submit" class="btn btn-primario btn-grande" id="btn-enviar">Ingresar</button>
      <button type="button" class="link" id="btn-olvide">Me olvidé la contraseña</button>
    </form>

    <div class="separador">o</div>

    <button type="button" class="btn btn-grande" id="btn-google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.5z"/><path fill="#34A853" d="M12 23.5c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A11.5 11.5 0 0 0 12 23.5z"/><path fill="#FBBC05" d="M5.6 14.2a6.9 6.9 0 0 1 0-4.4v-3H1.8a11.5 11.5 0 0 0 0 10.4z"/><path fill="#EA4335" d="M12 4.6c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.5 11.5 0 0 0 1.8 6.8l3.8 3c.9-2.8 3.4-5.2 6.4-5.2z"/></svg>
      Seguir con Google
    </button>
  </main>

  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
