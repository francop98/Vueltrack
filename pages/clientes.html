<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Clientes habituales</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/mapa.css">
</head>
<body>
  <div class="app">
    <main class="contenido">
      <header class="barra-sup">
        <div class="barra-izq">
          <a class="marca" href="/" aria-label="Vueltrack, inicio">
          <img src="/assets/icono.svg" alt="">
          <span class="marca-texto">vuel<span>track</span></span>
        </a>
        </div>
      </header>

      <div class="titulo-bloque">
        <span class="sobre-titulo" id="cantidad"></span>
        <h1 class="titulo">Clientes habituales</h1>
      </div>

      <div class="buscador-caja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="solo-lector" for="filtro-texto">Buscar cliente</label>
        <input id="filtro-texto" placeholder="Buscar cliente" autocomplete="off">
      </div>

      <div class="chips" role="group" aria-label="Filtrar clientes">
        <button type="button" class="chip activo" data-filtro="todos" aria-pressed="true">Todos</button>
        <button type="button" class="chip" data-filtro="hoy" aria-pressed="false" id="chip-hoy">Les toca hoy</button>
      </div>

      <button type="button" class="btn btn-contorno oculto" id="btn-sumar-hoy"></button>

      <div class="cargando" id="cargando" aria-label="Cargando"></div>
      <div id="listado" class="seccion"></div>

      <div class="vacio oculto" id="vacio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>
        <strong id="vacio-titulo">Todavía no cargaste clientes</strong>
        <p id="vacio-texto">Guardá a los que visitás seguido y sumalos a la vuelta con un toque.</p>
      </div>
    </main>
  </div>

  <button type="button" class="btn btn-primario btn-grande flotante" id="btn-nuevo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Nuevo cliente
  </button>

  <nav class="nav-inferior" id="nav" aria-label="Secciones"></nav>
  <script src="/js/nav.js"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/clientes.js"></script>
</body>
</html>
