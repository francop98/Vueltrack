<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Cotizar un flete</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/cotizar.css">
</head>
<body>
  <div class="app">
    <main class="contenido">
      <header class="barra-sup">
        <div class="barra-izq">
          <button type="button" class="btn-icono" id="btn-menu" aria-label="Abrir menú" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <a class="marca" href="/" aria-label="Vueltrack, inicio">
          <img src="/assets/icono.svg" alt="">
          <span class="marca-texto">vuel<span>track</span></span>
        </a>
        </div>
      </header>

      <div class="titulo-bloque">
        <span class="sobre-titulo">Para pasar un presupuesto</span>
        <h1 class="titulo">Cotizar un flete</h1>
      </div>

      <section class="seccion">
        <div class="campo buscador">
          <label for="origen">Sale desde</label>
          <div class="buscador-caja">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="origen" placeholder="Dirección o nombre del lugar">
          </div>
        </div>
        <div class="campo buscador">
          <label for="destino">Destinos</label>
          <div class="buscador-caja">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="destino" placeholder="Agregar destino">
          </div>
        </div>
        <div class="lista" id="lista-destinos"></div>
        <label class="fila interruptor tarjeta" for="volver">
          <span>Vuelve al punto de salida</span>
          <input type="checkbox" id="volver" checked>
        </label>
      </section>

      <section class="seccion">
        <h2 class="subtitulo">Costos</h2>
        <div class="campo">
          <label for="vehiculo">Vehículo</label>
          <select id="vehiculo" class="input"></select>
        </div>
        <div class="grilla-2 siempre">
          <div class="campo">
            <label for="demora">Demora por destino (min)</label>
            <input id="demora" type="number" inputmode="numeric" min="0" step="5" value="15">
          </div>
          <div class="campo">
            <label for="hora">Tu hora de trabajo ($)</label>
            <input id="hora" type="number" inputmode="decimal" min="0" step="500" placeholder="0">
          </div>
        </div>
        <div class="grilla-2 siempre">
          <div class="campo">
            <label for="otros">Peajes y otros ($)</label>
            <input id="otros" type="number" inputmode="decimal" min="0" step="100" placeholder="0">
          </div>
          <div class="campo">
            <label for="margen">Ganancia (%)</label>
            <input id="margen" type="number" inputmode="decimal" min="0" step="5" value="30">
          </div>
        </div>
      </section>

      <button type="button" class="btn btn-primario btn-grande" id="btn-calcular" disabled>Calcular</button>
      <p class="error-texto oculto" id="error" role="alert"></p>

      <section class="seccion oculto" id="resultado">
        <div class="tarjeta-destacada">
          <span class="acento">Precio sugerido</span>
          <strong class="titulo" id="total"></strong>
          <span class="tenue" id="resumen"></span>
        </div>
        <div class="lista" id="detalle"></div>
        <div class="campo">
          <label for="cliente">Cliente (opcional)</label>
          <input id="cliente" placeholder="Nombre del cliente">
        </div>
        <div class="campo">
          <label for="aclaracion">Aclaraciones (opcional)</label>
          <textarea id="aclaracion" placeholder="Ej.: incluye carga y descarga, validez 7 días"></textarea>
        </div>
        <div class="campo">
          <label for="precio-final">Precio final que pasás ($)</label>
          <input id="precio-final" type="number" inputmode="decimal" min="0" step="100">
        </div>
        <div class="grilla-2 siempre">
          <a class="btn btn-primario" id="btn-whatsapp" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
          <button type="button" class="btn" id="btn-pdf">Descargar PDF</button>
        </div>
      </section>
    </main>
  </div>

  <article class="presupuesto" id="presupuesto" aria-hidden="true"></article>

  <nav class="nav-inferior" id="nav" aria-label="Secciones"></nav>

  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/cotizar.js"></script>
</body>
</html>
