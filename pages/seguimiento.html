<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Seguí tu entrega</title>
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/ingreso.css">
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="ingreso seguimiento">
    <div class="ingreso-marca">
      <img src="/assets/icono.svg" alt="">
      <span class="texto-tenue" id="equipo"></span>
    </div>

    <section class="tarjeta-destacada" id="estado" aria-live="polite">
      <span class="acento" id="estado-sobre">Seguimiento</span>
      <strong class="titulo" id="estado-titulo">Cargando…</strong>
      <span class="tenue" id="estado-texto"></span>
    </section>

    <div class="grilla-stats dos oculto" id="datos">
      <div class="stat"><span class="stat-valor" id="dato-antes">—</span><span class="stat-nombre" id="dato-antes-nombre">entregas antes</span></div>
      <div class="stat"><span class="stat-valor" id="dato-hora">—</span><span class="stat-nombre">llegada aprox.</span></div>
    </div>

    <p class="texto-tenue centrado-texto" id="actualizado"></p>
    <p class="texto-tenue centrado-texto">Seguimiento con Vueltrack</p>
  </main>

  <script type="module" src="/js/seguimiento.js"></script>
</body>
</html>
