<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1420">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vueltrack">
  <title>Vueltrack — Mi vehículo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icono-180.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <main class="contenido">
      <header class="barra-sup">
        <div class="barra-izq">
          <a class="marca" href="/" aria-label="Vueltrack, inicio">
            <img src="/assets/icono.svg" alt="">
            <span class="marca-texto">vuel<span>track</span></span>
          </a>
        </div>
      </header>

      <div class="titulo-bloque">
        <span class="sobre-titulo">Datos, vencimientos y service</span>
        <h1 class="titulo">Mi vehículo</h1>
      </div>

      <form class="seccion" id="form" novalidate>
        <div class="campo">
          <label for="nombre">Vehículo</label>
          <input id="nombre" placeholder="Marca y modelo" autocomplete="off">
        </div>

        <fieldset class="campo sin-borde">
          <legend class="etiqueta-campo">Tipo</legend>
          <div class="casillas" id="tipos">
            <label class="casilla"><input type="radio" name="tipo" value="auto"><span>Auto</span></label>
            <label class="casilla"><input type="radio" name="tipo" value="camion"><span>Camión</span></label>
            <label class="casilla"><input type="radio" name="tipo" value="camioneta"><span>Camioneta</span></label>
            <label class="casilla"><input type="radio" name="tipo" value="moto"><span>Moto</span></label>
            <label class="casilla"><input type="radio" name="tipo" value="utilitario" checked><span>Utilitario</span></label>
          </div>
        </fieldset>

        <div class="campo">
          <label for="capacidad">Capacidad en bultos (opcional)</label>
          <input id="capacidad" type="number" inputmode="numeric" min="0" step="1" placeholder="Sin límite">
          <span class="texto-tenue">Si la cargás, al ordenar no te asigna más bultos de los que entran.</span>
        </div>

        <button type="submit" class="btn btn-primario btn-grande" id="btn-guardar">Guardar vehículo</button>
      </form>

      <section class="seccion">
        <div class="fila-titulo">
          <h2 class="subtitulo">Vencimientos</h2>
          <button type="button" class="chip" id="btn-vencimiento"><span class="mas" aria-hidden="true">+</span>Agregar</button>
        </div>
        <div class="lista" id="lista-vencimientos"></div>
        <p class="texto-tenue" id="sin-vencimientos">Cargá la VTV, el seguro o la patente y te avisamos 15 días antes.</p>
      </section>

      <section class="seccion">
        <h2 class="subtitulo">Service</h2>
        <div class="tarjeta seccion" id="estado-service"></div>
        <button type="button" class="btn btn-contorno" id="btn-service">Cargar datos del service</button>
      </section>
    </main>
  </div>

  <nav class="nav-inferior" id="nav" aria-label="Secciones"></nav>
  <script src="/js/nav.js"></script>

  <script src="/js/pwa.js"></script>
  <script type="module" src="/js/vehiculo.js"></script>
</body>
</html>
